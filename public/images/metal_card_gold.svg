<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Brushed Gold Metallic Gradients -->
    <radialGradient id="goldRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="25%" stop-color="#e8c464"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#b08a1c"/>
      <stop offset="100%" stop-color="#7a5c0b"/>
    </radialGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffae0" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#a07a14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffefa0" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="50%" stop-color="#aa851c"/>
      <stop offset="100%" stop-color="#604608"/>
    </linearGradient>

    <filter id="engrave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#553a04" flood-opacity="0.9"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.5" flood-color="#fff8cc" flood-opacity="0.8"/>
    </filter>

    <pattern id="brushedTexture" width="600" height="900" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="600" y2="0" stroke="#f5d77f" stroke-width="0.5" opacity="0.3"/>
      <circle cx="300" cy="420" r="280" fill="none" stroke="#fff0aa" stroke-width="0.5" opacity="0.15"/>
      <circle cx="300" cy="420" r="220" fill="none" stroke="#aa8210" stroke-width="0.5" opacity="0.15"/>
      <circle cx="300" cy="420" r="160" fill="none" stroke="#fff0aa" stroke-width="0.5" opacity="0.15"/>
      <circle cx="300" cy="420" r="100" fill="none" stroke="#aa8210" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Heavy Card Outer Body -->
  <rect x="20" y="20" width="560" height="860" rx="45" ry="45" fill="url(#goldRadial)" stroke="url(#goldBezel)" stroke-width="8"/>
  <rect x="20" y="20" width="560" height="860" rx="45" ry="45" fill="url(#brushedTexture)" opacity="0.6"/>
  <rect x="20" y="20" width="560" height="860" rx="45" ry="45" fill="url(#goldSheen)" mix-blend-mode="overlay" opacity="0.5"/>

  <!-- Inner Debossed Bezel Border -->
  <rect x="42" y="42" width="516" height="816" rx="34" ry="34" fill="none" stroke="#7a580c" stroke-width="3.5" opacity="0.85"/>
  <rect x="44" y="44" width="512" height="812" rx="32" ry="32" fill="none" stroke="#fff8cc" stroke-width="1.5" opacity="0.7"/>

  <!-- HEADER TEXT: LEONARDO DICAPRIO -->
  <g filter="url(#engrave)" fill="#442e03" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', serif">
    <text x="300" y="145" font-size="34" font-weight="700" letter-spacing="9">LEONARDO</text>
    <text x="300" y="195" font-size="34" font-weight="700" letter-spacing="8">DiCAPRIO</text>
  </g>

  <!-- DUAL EMBLEM: FILM REEL & CONSERVATION TREE IN CIRCLE -->
  <g transform="translate(300, 290)" filter="url(#engrave)" stroke="#442e03" fill="none">
    <!-- Outer Emblem Rings -->
    <circle cx="0" cy="0" r="54" stroke-width="4"/>
    <circle cx="0" cy="0" r="48" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Left side: Film Reel Perforations -->
    <g transform="translate(-20, 0)">
      <circle cx="0" cy="0" r="22" stroke-width="3"/>
      <circle cx="0" cy="0" r="7" fill="#442e03"/>
      <circle cx="0" cy="-14" r="3" fill="#442e03"/>
      <circle cx="0" cy="14" r="3" fill="#442e03"/>
      <circle cx="-14" cy="0" r="3" fill="#442e03"/>
      <circle cx="14" cy="0" r="3" fill="#442e03"/>
    </g>

    <!-- Right side: Conservation / Earth Alliance Tree -->
    <g transform="translate(20, 2)">
      <!-- Tree Trunk -->
      <path d="M-2,18 L-2,6 Q-2,0 0,-6 Q2,0 2,6 L2,18 Z" fill="#442e03" stroke-width="1"/>
      <!-- Tree Canopy Clouds -->
      <path d="M-14,0 Q-16,-12 -6,-16 Q0,-24 8,-18 Q16,-14 14,0 Q18,8 10,12 Q0,16 -10,10 Z" fill="#442e03" opacity="0.85"/>
      <line x1="-12" y1="18" x2="12" y2="18" stroke-width="2"/>
    </g>
  </g>

  <!-- CARD TITLE: VIP EXCLUSIVE GREET & MEET EXPERIENCE -->
  <g filter="url(#engrave)" fill="#442e03" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', serif">
    <text x="300" y="405" font-size="20" font-weight="700" letter-spacing="8">EXCLUSIVE</text>
    <text x="300" y="445" font-size="24" font-weight="900" letter-spacing="6">VIP GREET &amp; MEET</text>
    <text x="300" y="482" font-size="19" font-weight="700" letter-spacing="7">EXPERIENCE</text>
  </g>

  <!-- LEO ENGRAVED PROFILE CAMEO (Matching the coin portrait from uploaded image) -->
  <g transform="translate(300, 660)" filter="url(#engrave)">
    <!-- Subtle circular cameo frame -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#5d4107" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="99" fill="none" stroke="#fff8cc" stroke-width="1" opacity="0.5"/>

    <!-- Engraved Cameo Head Profile looking Right -->
    <path d="
      M -35, 65
      C -30, 45 -25, 25 -32, 5
      C -38, -15 -42, -35 -30, -55
      C -22, -68 -8, -75 10, -74
      C 26, -73 38, -62 44, -48
      C 48, -38 46, -28 42, -22
      C 48, -20 54, -14 56, -6
      C 58, 2 52, 10 46, 12
      C 52, 16 54, 22 52, 28
      C 50, 34 44, 38 38, 40
      C 42, 48 38, 56 30, 62
      C 20, 70 8, 72 -5, 70
      C -15, 68 -28, 68 -35, 65 Z
    " fill="#442e03" opacity="0.88"/>

    <!-- Detailed engraved lines for slicked back hair, jawline, collar -->
    <!-- Hair Texture Strands -->
    <path d="M-20,-65 Q10,-70 30,-50 M-25,-52 Q5,-58 35,-38 M-28,-40 Q0,-45 38,-28 M-30,-28 Q-5,-32 25,-20" stroke="#fff5b5" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Eye & Brow -->
    <path d="M12,-32 Q22,-36 32,-30 M18,-24 Q24,-26 28,-22" stroke="#fff5b5" stroke-width="1.8" fill="none" opacity="0.7"/>
    <!-- Nose profile contour -->
    <path d="M26,-28 L38,-14 L48,-6 L36, -2" stroke="#fff5b5" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Lips & Chin contour -->
    <path d="M34,4 Q42,8 36,14 M35,16 Q44,24 34,30 M30,34 Q38,44 26,52" stroke="#fff5b5" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Beard / Jawline Stipple -->
    <path d="M5,42 Q20,44 26,50 M-8,35 Q10,38 18,48" stroke="#fff5b5" stroke-width="1.5" stroke-dasharray="2,2" fill="none" opacity="0.5"/>
    <!-- Neck line & collar -->
    <path d="M-22,30 Q-15,55 -10,68 M15,54 Q18,62 20,68" stroke="#fff5b5" stroke-width="2.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Bottom Serial & Authenticity Chip Markings -->
  <g fill="#5d4107" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.85">
    <text x="300" y="830">VIP EDITION · CERTIFIED 24K PURE METAL</text>
  </g>
</svg>
